name: LFTech deploy existing image

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Existing Docker Hub image digest, including sha256: prefix'
        required: true
        type: string
      source_sha:
        description: 'Full source commit SHA recorded in the image labels'
        required: true
        type: string
      version:
        description: 'Application version recorded in the image labels; review DB compatibility before rollback'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lftech-new-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'NestOfToken/new-api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install TAT client
        run: python -m pip install --disable-pip-version-check -r .github/scripts/requirements-tat.txt
      - name: Deploy existing image and wait for TAT result
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ${{ secrets.TENCENTCLOUD_REGION }}
          TENCENTCLOUD_INSTANCE_ID: ${{ secrets.TENCENTCLOUD_INSTANCE_ID }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          LFTECH_IMAGE_REF: ${{ vars.DOCKERHUB_IMAGE }}@${{ inputs.image_digest }}
          LFTECH_SOURCE_SHA: ${{ inputs.source_sha }}
          LFTECH_VERSION: ${{ inputs.version }}
          LFTECH_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python .github/scripts/tat_deploy.py
